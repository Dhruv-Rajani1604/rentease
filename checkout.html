<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout - RentEase</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a href="index.html" class="logo">RentEase</a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html" class="active">Cart</a>
          <a href="login.html">Login</a>
          <a href="rentals.html">My Rentals</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <div class="wrap">
          <h1>Checkout</h1>

          <p id="empty-cart" class="form-hint" style="display: none">
            Your cart is empty. <a href="products.html">Browse products</a>
          </p>

          <div class="checkout-layout">
            <form class="panel" id="checkout-form" novalidate>
              <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" autocomplete="name" />
                <div class="field-error" id="name-error"></div>
              </div>

              <div class="field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  autocomplete="email"
                />
                <div class="field-error" id="email-error"></div>
              </div>

              <div class="field">
                <label for="address">Delivery address</label>
                <textarea
                  id="address"
                  name="address"
                  autocomplete="street-address"
                ></textarea>
                <div class="field-error" id="address-error"></div>
              </div>

              <div class="field">
                <label for="delivery">Delivery date</label>
                <input type="date" id="delivery" name="delivery" />
                <div class="field-error" id="delivery-error"></div>
              </div>

              <p class="form-hint">Demo checkout: no real payment is taken.</p>
              <button type="submit" class="btn">Confirm rental</button>
            </form>

            <div class="panel" id="checkout-summary"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        RentEase – Furniture & Appliance Rental Platform. Sample products and
        prices.
      </div>
    </footer>

    <script src="js/cart.js" defer></script>
    <script src="js/checkout.js" defer></script>
  </body>
</html>
