<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - RentEase</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a href="index.html" class="logo">RentEase</a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html" class="active">Products</a>
          <a href="cart.html">Cart</a>
          <a href="login.html">Login</a>
          <a href="rentals.html">My Rentals</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <div class="wrap">
          <h1>Products</h1>

          <div class="controls">
            <input
              type="search"
              class="search"
              placeholder="Search products"
              aria-label="Search products"
            />
            <button class="chip">All</button>
            <button class="chip">Furniture</button>
            <button class="chip">Appliances</button>
          </div>

          <h2>Furniture</h2>
          <div class="grid" id="furniture-grid"></div>
          <h2>Appliances</h2>
         <div class="grid" id="appliance-grid"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        RentEase – Furniture & Appliance Rental Platform. Sample products and
        prices.
      </div>
    </footer>

    <script src="js/products.js" defer></script>
  </body>
</html>
