<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - RentEase</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      section.page {
        padding: 40px 0;
      }
      h1 {
        font-size: 2rem;
        margin-bottom: 18px;
      }
      .auth-box {
        background: #fff;
        border: 1px solid #fed7aa;
        border-radius: 12px;
        padding: 28px;
        max-width: 420px;
        margin: 0 auto;
      }
      .field {
        margin-bottom: 16px;
      }
      .field label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #fed7aa;
        border-radius: 8px;
        font-size: 1rem;
      }
      .btn {
        display: inline-block;
        width: 100%;
        padding: 12px 22px;
        border-radius: 8px;
        background: #ea580c;
        color: #fff;
        font-weight: bold;
        border: none;
        font-size: 1rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a href="index.html" class="logo">RentEase</a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart</a>
          <a href="login.html" class="active">Login</a>
          <a href="rentals.html">My Rentals</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <div class="wrap">
          <h1>Login</h1>
          <div class="auth-box">
            <form>
              <div class="field">
                <label for="email">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
              <div class="field">
                <label for="password">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  required
                />
              </div>
              <button type="submit" class="btn">Login</button>
            </form>
            <p class="meta">New here? <a href="#">Create an account</a></p>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        RentEase - Furniture & Appliance Rental Platform. Sample products and
        prices.
      </div>
    </footer>
  </body>
</html>
