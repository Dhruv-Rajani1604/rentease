<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RentEase</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body{
            font-family: Arial, Helvetica, sans-serif;
            color: #1e293b;
            background: #fff7ed;
            line-height: 1.5;
        }
        a{
            color: #ea580c;
        }
        header{
            background: #fff;
            border-bottom: 1px solid #fed7aa;
        }
        .wrap{
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }
        .bar{
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }
        .logo{
            font-weight: bold;
            font-size: 1.3rem;
            color: #ea580c;
            text-decoration: none;
        }
        nav a{
            margin-left: 16px;
            text-decoration: none;
        }
        section.page{
            padding: 40px 0;
        }
        h1{
            font-size: 2rem;
            margin-bottom: 18px;
        }
        .auth-box{
            background: #fff;
            border: 1px solid #fed7aa;
            border-radius: 12px;
            padding: 28px;
            max-width: 420px;
            margin: 0 auto;
        }
        .field{
            margin-bottom: 16px;
        }
        .field label{
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .field input{
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #fed7aa;
            border-radius: 8px;
            font-size: 1rem;
        }
        .btn{
            display: inline-block;
            width: 100%;
            padding: 12px 22px;
            border-radius: 8px;
            background: #ea580c;
            color: #fff;
            font-weight: bold;
            border: none;
            font-size: 1rem;
            cursor: pointer;
        }
        .meta{
            color: #64748b;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 16px;
        }
        footer{
            background: #fff;
            border-top: 1px solid #fed7aa;
            padding: 22px 0;
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <div class="wrap bar">
            <a href="index.html" class="logo">RentEase</a>
            <nav>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="page">
            <div class="wrap">
                <h1>Login</h1>
                <div class="auth-box">
                    <form>
                        <div class="field">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="field">
                            <label for="password">Password</label>
                            <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn">Login</button>
                    </form>
                    <p class="meta">New here? <a href="login.html">Create an account</a></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="wrap">
            RentEase - Furniture & Appliance Rental Platform. Sample products and prices.
        </div>
    </footer>
</body>
</html>
