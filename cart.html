<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Cart - RentEase</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a href="index.html" class="logo">RentEase</a>
        <nav>
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html" class="active">Cart</a>
          <a href="login.html">Login</a>
          <a href="rentals.html">My Rentals</a>
          <a href="faq.html">FAQ</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="page">
        <div class="wrap">
          <h1>Your cart</h1>

          <p id="empty-cart" class="form-hint" style="display: none">
            Your cart is empty. <a href="products.html">Browse products</a>
          </p>

          <div class="cart-layout">
            <div id="cart-items"></div>

            <div class="panel" id="summary" style="display: none">
              <h2 style="font-size: 1.2rem; margin-bottom: 14px">Summary</h2>
              <div class="summary-row">
                <span>Monthly total</span><span id="sum-monthly"></span>
              </div>
              <div class="summary-row">
                <span>Deposits</span><span id="sum-deposits"></span>
              </div>
              <div class="summary-row total">
                <span>Pay now (first month + deposits)</span
                ><span id="sum-paynow"></span>
              </div>
              <a
                href="checkout.html"
                class="btn"
                style="margin-top: 16px; display: block"
                >Continue to checkout</a
              >
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        RentEase – Furniture & Appliance Rental Platform. Sample products and
        prices.
      </div>
    </footer>

    <script src="js/cart.js" defer></script>
  </body>
</html>
