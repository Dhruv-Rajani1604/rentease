<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RentEase – Furniture & Appliance Rental</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        color: #1e293b;
        background: #fff7ed;
        line-height: 1.5;
      }
      a {
        color: inherit;
      }
      header {
        background: #fff;
        border-bottom: 1px solid #fed7aa;
      }
      .wrap {
        max-width: 1100px;
        margin: 0 auto;
        padding: 0 16px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 64px;
      }
      .logo {
        font-weight: bold;
        font-size: 1.3rem;
        color: #ea580c;
        text-decoration: none;
      }
      nav a {
        margin-left: 16px;
        text-decoration: none;
      }
      .hero {
        background: linear-gradient(135deg, #ea580c, #f59e0b);
        color: #fff;
        padding: 60px 0;
        text-align: center;
      }
      .hero h1 {
        font-size: 2.2rem;
        margin-bottom: 12px;
      }
      .hero p {
        max-width: 600px;
        margin: 0 auto 24px;
      }
      .btn {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 8px;
        background: #fff;
        color: #ea580c;
        font-weight: bold;
        text-decoration: none;
      }
      footer {
        background: #fff;
        border-top: 1px solid #fed7aa;
        padding: 22px 0;
        color: #64748b;
        font-size: 0.9rem;
        margin-top: 40px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap bar">
        <a href="index.html" class="logo">RentEase</a>
        <nav>
          <a href="index.html#products">Products</a>
          <a href="index.html#login">Login</a>
        </nav>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="wrap">
          <h1>Rent furniture and appliances monthly</h1>
          <p>
            Flexible plans from 3 to 12 months. No big upfront cost, and easy to
            move when you relocate.
          </p>
          <a href="#products" class="btn">Browse products</a>
        </div>
      </section>
    </main>

    <footer>
      <div class="wrap">
        RentEase – Furniture & Appliance Rental Platform. Sample products and
        prices.
      </div>
    </footer>
  </body>
</html>
